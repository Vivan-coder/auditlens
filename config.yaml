# AuditLens configuration. All thresholds live here, not in code.

company:
  name: "Gulf Meridian Trading W.L.L."   # fictional
  currency: BHD
  fiscal_year: 2025

calendar:
  country: BH                  # Bahrain public holidays (weekend = Friday/Saturday)
  period_close_days: 5         # a period closes this many days after month end

# Approval hierarchy. Roles are ranked; an approver must outrank the creator.
# approval_limit = the largest single entry the role can approve.
roles:
  ap_clerk:             {rank: 0, approval_limit: 0,       count: 3}
  accountant:           {rank: 1, approval_limit: 25000,   count: 3}
  senior_accountant:    {rank: 2, approval_limit: 100000,  count: 2}
  financial_controller: {rank: 3, approval_limit: 500000,  count: 1}
  cfo:                  {rank: 4, approval_limit: 5000000, count: 1}

generation:
  seed: 42
  target_lines: 50000          # approximate number of journal lines
  n_vendors: 110               # regular (non-recurring) vendors
  n_employees: 60
  # relative monthly volume (Jan..Dec): seasonal revenue, Ramadan dip in March, strong Q4
  sales_seasonality:    [0.85, 0.80, 0.80, 0.85, 1.00, 0.95, 0.90, 0.90, 1.05, 1.15, 1.25, 1.35]
  purchase_seasonality: [0.90, 0.85, 0.85, 0.90, 1.00, 1.00, 0.95, 0.95, 1.05, 1.10, 1.15, 1.20]

# Number of planted anomalies per type (labels are written to a SEPARATE file).
anomalies:
  duplicate_payment: 25
  split_purchase_groups: 12
  weekend_holiday_posting: 30
  round_amount: 30
  same_creator_approver: 30
  post_close_posting: 15
  backdated_posting: 15
  ghost_vendor_bank: 2
  ghost_vendor_address: 1
  bank_change_large_payment: 8
  invoice_sequence_gap: 10
  invoice_sequence_out_of_order: 10
  unusual_pairing: 24
  rare_user_account: 25
  benford_vendor_invoices: 60
  large_manual_period_end: 12

# Account codes the tests rely on (change these to run AuditLens on another chart of accounts)
accounts:
  payables: 2000
  cash: 1000

# ---- Phase 2: audit test thresholds ----------------------------------------------------------
rules:
  duplicates:
    window_days: 7             # two payments to one vendor this close together are suspicious
    amount_tolerance_pct: 0.5  # ...if amounts differ by no more than this percentage (weak evidence)
    min_amount: 100
  split_purchase:
    band_low_pct: 90           # "just under" an approval limit = 90% to 100% of it
    window_days: 10
    min_count: 3               # this many near-limit invoices (same vendor + creator) = a split
  timing:
    weekend_sources: [manual]  # automated month-end batches legitimately run on weekends
    backdate_days: 30          # posting this many days after the document date = backdated
  round_amount:
    multiple: 1000
    min_amount: 5000
    sources: [manual]
    recurring_repeat_exempt: 6 # same vendor + amount repeated this often = a contract, not a red flag
  materiality:
    amount: 250000             # manual entries at or above this are material
    period_end_business_days: 3
    sources: [manual]
  bank_change:
    window_days: 14            # a payment this soon after a bank-account change is risky...
    min_amount: 20000          # ...if it is at least this large
    median_multiple: 5         # ...and at least this multiple of the vendor's median payment
  invoice_sequence:
    max_gap: 50                # a jump larger than this between consecutive invoice numbers
  benford:
    min_invoices: 50           # chi-square is unreliable on fewer observations
    p_threshold: 0.001
  pairings:
    rare_pair_max_count: 3     # a debit/credit account pair seen at most this many times all year
    rare_user_account_max_count: 3
    user_min_entries: 50       # only judge users with a real history

# ---- Phase 3: machine learning and combined risk score ---------------------------------------
ml:
  n_estimators: 300
  seed: 42
  flag_percentile: 0.98        # entries in the top 2% of Isolation Forest scores are ML-flagged
  explain_top_features: 3      # features quoted in an ML reason

scoring:
  # Evidence weight of each rule (0-100). Several hits combine as a "noisy OR", so they add up
  # but never exceed 100. Strong, specific tests weigh more than weak or noisy ones.
  rule_weights:
    DUP_SAME_INVOICE: 40
    DUP_EXACT_AMOUNT: 35
    DUP_NEAR_AMOUNT: 8
    SPLIT_BELOW_LIMIT: 35
    SELF_APPROVED: 35
    NO_APPROVER: 30
    APPROVER_OVER_LIMIT: 25
    WEEKEND_POSTING: 25
    HOLIDAY_POSTING: 25
    POST_CLOSE_POSTING: 35
    BACKDATED_POSTING: 25
    ROUND_AMOUNT: 25
    LARGE_MANUAL_PERIOD_END: 40
    LARGE_MANUAL: 25
    GHOST_VENDOR_BANK: 45
    GHOST_VENDOR_ADDRESS: 35
    BANK_CHANGE_LARGE_PAYMENT: 35
    INVOICE_GAP: 25
    INVOICE_OUT_OF_ORDER: 30
    DUPLICATE_INVOICE_NUMBER: 30
    BENFORD_VENDOR: 15         # vendor-level signal, so it flags every invoice of the vendor
    RARE_ACCOUNT_PAIR: 30
    RARE_USER_ACCOUNT: 25
  default_rule_weight: 15      # for rule codes not listed above
  ml_max_points: 30            # the ML score can add at most this many points, and only to
                               # ML-flagged entries (top ml.flag_percentile of anomaly scores)
  queue_min_score: 1           # entries below this are not put in the review queue
